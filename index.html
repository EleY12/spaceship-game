async function supabaseFetch(path, options = {}) {
  const url = `${SUPABASE_URL}/rest/v1/${path}`;
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json",
    "Prefer": "return=representation",
    ...(options.headers || {})
  };
  const response = await fetch(url, { ...options, headers });
  return await response.json();
}

function drawFallbackShip(x, y) {
  ctx.save();
  ctx.shadowColor = "#00ffff";
  ctx.shadowBlur = 10;
  ctx.fillStyle = "#00bfff";
  ctx.beginPath();
  ctx.moveTo(x + 32, y);
  ctx.lineTo(x + 65, y + 60);
  ctx.lineTo(x + 50, y + 70);
  ctx.lineTo(x + 32, y + 55);
  ctx.lineTo(x + 15, y + 70);
  ctx.lineTo(x, y + 60);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(x + 32, y + 25, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function getRandomScout(hp = 1.0) {
  const speedBonus = levelSpeedMultiplier * 0.5;
  const roll = Math.random();
  let enemyX, enemyY, speedX, speedY, typeStr;

  if (roll < 0.35) {
    enemyX = Math.random() * 700 + 50;
    enemyY = -Math.random() * 100 - 50;
    speedX = 0;
    speedY = Math.random() * 2 + 2.2 + speedBonus;
    typeStr = "SINE";
  } else if (roll < 0.70) {
    enemyX = Math.random() < 0.5 ? -20 : 820;
    enemyY = Math.random() * 250 + 50;
    speedX = Math.random() * 2.5 + 2 + speedBonus;
    if (enemyX > 0) speedX = -speedX;
    speedY = 0;
    typeStr = "STANDARD";
  } else {
    enemyX = Math.random() * 780;
    enemyY = -Math.random() * 100 - 50;
    speedX = 0;
    speedY = Math.random() * 2.5 + 2.5 + speedBonus;
    typeStr = "STANDARD";
  }
  return { x: enemyX, y: enemyY, vx: speedX, vy: speedY, type: typeStr, sinAngle: 0, hp: hp };
}

async function loadLeaderboard() {
  try {
    const data = await supabaseFetch("Player%20Info?select=high_score,username,level&order=high_score.desc&limit=5");
    if (Array.isArray(data)) {
      leaderboard = data.map(r => [r.high_score || 0, r.username || "Player", r.level || 1]);
    }
  } catch (e) {
    console.error("Leaderboard fetch error:", e);
  }
}

async function handleRegister() {
  if (!inputUsername || !inputPassword) {
    authMessage = "Error: Username & Password required!";
    return;
  }
  try {
    const existing = await supabaseFetch(`Player%20Info?username=eq.${encodeURIComponent(inputUsername)}`);
    if (Array.isArray(existing) && existing.length > 0) {
      authMessage = "Error: Username taken!";
      return;
    }

    await supabaseFetch("Player%20Info", {
      method: "POST",
      body: JSON.stringify({
        username: inputUsername,
        password: inputPassword,
        email: inputEmail,
        high_score: 0,
        score: 0,
        level: 1
      })
    });

    loggedInUser = inputUsername;
    userBestScore = 0;
    authMessage = "Success! Account Created.";
    resetGame();
    gameState = "PLAYING";
    bgm.play().catch(() => {});
  } catch (err) {
    authMessage = "Register Failed!";
  }
}

async function handleLogin() {
  if (!inputUsername || !inputPassword) {
    authMessage = "Error: Username & Password required!";
    return;
  }
  try {
    const data = await supabaseFetch(`Player%20Info?username=eq.${encodeURIComponent(inputUsername)}&password=eq.${encodeURIComponent(inputPassword)}`);
    if (Array.isArray(data) && data.length > 0) {
      loggedInUser = data[0].username;
      userBestScore = data[0].high_score || 0;
      authMessage = "Login Successful!";
      resetGame();
      gameState = "PLAYING";
      bgm.play().catch(() => {});
    } else {
      authMessage = "Error: Incorrect credentials.";
    }
  } catch (err) {
    authMessage = "Login Failed!";
  }
}

async function updateScoreInSupabase(finalScore, reachedLevel) {
  if (!loggedInUser) return;
  const newHigh = Math.max(userBestScore, finalScore);
  userBestScore = newHigh;

  try {
    await supabaseFetch(`Player%20Info?username=eq.${encodeURIComponent(loggedInUser)}`, {
      method: "PATCH",
      body: JSON.stringify({ score: finalScore, high_score: newHigh, level: reachedLevel })
    });
    loadLeaderboard();
  } catch (e) {}
}

window.addEventListener("keydown", e => {
  keys[e.key] = true;

  if (gameState === "AUTH") {
    if (e.key === "Tab") {
      e.preventDefault();
      if (authMode === "LOGIN") activeField = activeField === "username" ? "password" : "username";
      else {
        if (activeField === "username") activeField = "password";
        else if (activeField === "password") activeField = "email";
        else activeField = "username";
      }
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      authMode = authMode === "LOGIN" ? "REGISTER" : "LOGIN";
      authMessage = `Switched to ${authMode} mode.`;
    } else if (e.key === "Enter") {
      if (authMode === "LOGIN") handleLogin();
      else handleRegister();
    } else if (e.key === "Backspace") {
      if (activeField === "username") inputUsername = inputUsername.slice(0, -1);
      if (activeField === "password") inputPassword = inputPassword.slice(0, -1);
      if (activeField === "email") inputEmail = inputEmail.slice(0, -1);
    } else if (e.key.length === 1) {
      if (activeField === "username" && inputUsername.length < 15) inputUsername += e.key;
      if (activeField === "password" && inputPassword.length < 20) inputPassword += e.key;
      if (activeField === "email" && inputEmail.length < 30) inputEmail += e.key;
    }
  } else if (e.key === "Escape" && (gameState === "PLAYING" || gameState === "PAUSED")) {
    gameState = gameState === "PLAYING" ? "PAUSED" : "PLAYING";
  }

  if (gameState === "GAMEOVER" && e.key.toLowerCase() === "r") {
    resetGame();
    gameState = "PLAYING";
  } else if (gameState === "SHOP") {
    if (e.key === "1") {
      if (score >= 150) { score -= 150; shipSpeed++; boughtSound(); }
    } else if (e.key === "2") {
      if (score >= 100 && shieldCount < 2) {

      bosses = [];
      bossMissiles = [];
      spawnStandardEnemies();
      gameState = "PLAYING";
    }

    if (e.key.toLowerCase() === "c") {
      if (dodgeCooldown <= 0) { dodgeTimer = 20; dodgeCooldown = 300; shieldSound(); }
    } else if (e.key.toLowerCase() === "v" || e.key === "Control") {
      if (speedBoostCooldown <= 0) { speedBoostTimer = 180; speedBoostCooldown = 480; boughtSound(); }
    } else if (e.key === "Shift") {
      if (ultimateActiveTimer === 0 && ultimateCharge >= 100) {
        ultimateActiveTimer = 120;
        ultimateCharge = 0;
        triggerShake(120, 10);
        if (currentMission === "ULTIMATE_USER") { score += 300; selectNewMission(); }
      }
    }
  }
});
