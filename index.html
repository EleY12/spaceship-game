<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Shooter: Ultimate Edition (Web)</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 20px rgba(0, 191, 255, 0.4);
    }
    canvas {
      background-color: #000;
      display: block;
      border: 2px solid #333;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
// ==========================================
// 1. SUPABASE DIRECT REST API CONFIG
// ==========================================
const SUPABASE_URL = "https://fidqfllnzxjcdpaiuykb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZHFmbGxuenhqY2RwYWl1eWtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMzUyMTIsImV4cCI6MjEwNTYxMTIxMn0.cKxT0xcLg4jxDl_6PYwXsysWhDG_Q8h7YjlJ0rKFYNc"; // Paste your long eyJ... anon key here

// Native Direct REST Fetcher (No external JS library required!)
async function supabaseFetch(path, options = {}) {
  const url = `${SUPABASE_URL}/rest/v1/${path}`;
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json",
    "Prefer": "return=representation",
    ...(options.headers || {})
  };
  const response = await fetch(url, { ...options, headers });
  return await response.json();
}

// ==========================================
// 2. CANVAS & AUDIO INITIALIZATION
// ==========================================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function safePlaySound(src, volume = 0.5) {
  try {
    const snd = new Audio(src);
    snd.volume = volume;
    snd.play().catch(() => {});
  } catch (e) {}
}

// Image Loader Helpers
function loadImage(src) {
  const img = new Image();
  img.src = src;
  return img;
}

const picture_ship = loadImage("SpaceShip-Blue.png");
const picture_missile = loadImage("Missile-Picture.png");
const picture_enemy = loadImage("enemies.tiff");
const picture_tank = loadImage("enemies-tank.png");

// ==========================================
// 3. GAME STATE & VARIABLES
// ==========================================
let gameState = "AUTH";
let authMode = "LOGIN";
let activeField = "username";

let inputUsername = "";
let inputPassword = "";
let inputEmail = "";
let authMessage = SUPABASE_KEY === "YOUR_SUPABASE_ANON_KEY" ? "Warning: Paste your SUPABASE_KEY into index.html!" : "";
let loggedInUser = null;
let userBestScore = 0;

let score = 0;
let level = 1;
let playerHealth = 3.0;
let playerMaxHealth = 5.0;
let shipX = 350;
let shipY = 400;
let shipSpeed = 5;
let fireCooldown = 0;

let missiles = [];
let enemies = [];
let leaderboard = [];

const keys = {};

const starsBack = Array.from({ length: 30 }, () => [Math.random() * 800, Math.random() * 600, Math.random() * 0.4 + 0.4]);
const starsMid = Array.from({ length: 20 }, () => [Math.random() * 800, Math.random() * 600, Math.random() * 0.6 + 1.2]);
const starsFore = Array.from({ length: 10 }, () => [Math.random() * 800, Math.random() * 600, Math.random() * 1.0 + 2.5]);

// ==========================================
// 4. SUPABASE DATABASE CALLS
// ==========================================
async function loadLeaderboard() {
  if (SUPABASE_KEY === "YOUR_SUPABASE_ANON_KEY") return;
  try {
    const data = await supabaseFetch("Player%20Info?select=high_score,username,level&order=high_score.desc&limit=5");
    if (Array.isArray(data)) {
      leaderboard = data.map(r => [r.high_score || 0, r.username || "Player", r.level || 1]);
    }
  } catch (e) {
    console.error("Leaderboard fetch error:", e);
  }
}

async function handleRegister() {
  if (!inputUsername || !inputPassword) {
    authMessage = "Error: Username & Password required!";
    return;
  }
  try {
    const existing = await supabaseFetch(`Player%20Info?username=eq.${encodeURIComponent(inputUsername)}`);
    if (Array.isArray(existing) && existing.length > 0) {
      authMessage = "Error: Username taken!";
      return;
    }

    await supabaseFetch("Player%20Info", {
      method: "POST",
      body: JSON.stringify({
        username: inputUsername,
        password: inputPassword,
        email: inputEmail,
        high_score: 0,
        score: 0,
        level: 1
      })
    });

    loggedInUser = inputUsername;
    userBestScore = 0;
    authMessage = "Success! Account Created.";
    resetGame();
    gameState = "PLAYING";
  } catch (err) {
    authMessage = "Register Failed!";
  }
}

async function handleLogin() {
  if (!inputUsername || !inputPassword) {
    authMessage = "Error: Username & Password required!";
    return;
  }
  try {
    const data = await supabaseFetch(`Player%20Info?username=eq.${encodeURIComponent(inputUsername)}&password=eq.${encodeURIComponent(inputPassword)}`);
    if (Array.isArray(data) && data.length > 0) {
      loggedInUser = data[0].username;
      userBestScore = data[0].high_score || 0;
      authMessage = "Login Successful!";
      resetGame();
      gameState = "PLAYING";
    } else {
      authMessage = "Error: Incorrect credentials.";
    }
  } catch (err) {
    authMessage = "Login Failed!";
  }
}

async function updateScoreInSupabase(finalScore, reachedLevel) {
  if (!loggedInUser || SUPABASE_KEY === "YOUR_SUPABASE_ANON_KEY") return;
  const newHigh = Math.max(userBestScore, finalScore);
  userBestScore = newHigh;

  try {
    await supabaseFetch(`Player%20Info?username=eq.${encodeURIComponent(loggedInUser)}`, {
      method: "PATCH",
      body: JSON.stringify({ score: finalScore, high_score: newHigh, level: reachedLevel })
    });
    loadLeaderboard();
  } catch (e) {}
}

loadLeaderboard();

// ==========================================
// 5. GAME CONTROLS & LOGIC
// ==========================================
function resetGame() {
  score = 0;
  level = 1;
  playerHealth = 3.0;
  shipX = 350;
  shipY = 400;
  missiles = [];
  enemies = [];
  for (let i = 0; i < 6; i++) {
    enemies.push({ x: Math.random() * 700 + 50, y: -Math.random() * 100 - 50, vy: Math.random() * 2 + 3 });
  }
}

window.addEventListener("keydown", e => {
  keys[e.key] = true;

  if (gameState === "AUTH") {
    if (e.key === "Tab") {
      e.preventDefault();
      if (authMode === "LOGIN") activeField = activeField === "username" ? "password" : "username";
      else {
        if (activeField === "username") activeField = "password";
        else if (activeField === "password") activeField = "email";
        else activeField = "username";
      }
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      authMode = authMode === "LOGIN" ? "REGISTER" : "LOGIN";
    } else if (e.key === "Enter") {
      if (authMode === "LOGIN") handleLogin();
      else handleRegister();
    } else if (e.key === "Backspace") {
      if (activeField === "username") inputUsername = inputUsername.slice(0, -1);
      if (activeField === "password") inputPassword = inputPassword.slice(0, -1);
      if (activeField === "email") inputEmail = inputEmail.slice(0, -1);
    } else if (e.key.length === 1) {
      if (activeField === "username" && inputUsername.length < 15) inputUsername += e.key;
      if (activeField === "password" && inputPassword.length < 20) inputPassword += e.key;
      if (activeField === "email" && inputEmail.length < 30) inputEmail += e.key;
    }
  } else if (gameState === "GAMEOVER" && e.key.toLowerCase() === "r") {
    resetGame();
    gameState = "PLAYING";
  }
});

window.addEventListener("keyup", e => { keys[e.key] = false; });

// ==========================================
// 6. RENDER & ENGINE LOOP
// ==========================================
function gameLoop() {
  // Update Background Stars
  for (let s of starsBack) { s[1] += s[2]; if (s[1] > 600) s[1] = 0; }
  for (let s of starsMid) { s[1] += s[2]; if (s[1] > 600) s[1] = 0; }
  for (let s of starsFore) { s[1] += s[2]; if (s[1] > 600) s[1] = 0; }

  if (gameState === "PLAYING") {
    if (keys["ArrowLeft"] && shipX > 0) shipX -= shipSpeed;
    if (keys["ArrowRight"] && shipX < 735) shipX += shipSpeed;
    if (keys["ArrowUp"] && shipY > 0) shipY -= shipSpeed;
    if (keys["ArrowDown"] && shipY < 530) shipY += shipSpeed;

    if (keys[" "] && fireCooldown <= 0) {
      safePlaySound("LaserSoundEffect.mp3", 0.25);
      missiles.push({ x: shipX + 25, y: shipY, vy: -7 });
      fireCooldown = 10;
    }
    if (fireCooldown > 0) fireCooldown--;

    // Update Missiles
    missiles.forEach((m, idx) => {
      m.y += m.vy;
      if (m.y < -30) missiles.splice(idx, 1);
    });

    // Update Enemies
    enemies.forEach((e, eIdx) => {
      e.y += e.vy;
      if (e.y > 650) { e.y = -50; e.x = Math.random() * 700 + 50; }

      // Check Bullet Collisions
      missiles.forEach((m, mIdx) => {
        if (Math.abs(m.x - e.x) < 30 && Math.abs(m.y - e.y) < 30) {
          missiles.splice(mIdx, 1);
          score += 10;
          e.y = -50;
          e.x = Math.random() * 700 + 50;
          safePlaySound("ExplosionSoundEffect.mp3", 0.3);
        }
      });

      // Player Collision
      if (Math.abs(shipX + 32 - e.x) < 35 && Math.abs(shipY + 35 - e.y) < 35) {
        playerHealth -= 0.5;
        e.y = -50;
        e.x = Math.random() * 700 + 50;
        safePlaySound("ExplosionSoundEffect.mp3", 0.5);
        if (playerHealth <= 0) {
          updateScoreInSupabase(score, level);
          gameState = "GAMEOVER";
        }
      }
    });
  }

  // DRAW CANVAS SCREEN
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, 800, 600);

  ctx.fillStyle = "#666"; starsBack.forEach(s => ctx.fillRect(s[0], s[1], 1, 1));
  ctx.fillStyle = "#aaa"; starsMid.forEach(s => ctx.fillRect(s[0], s[1], 2, 2));
  ctx.fillStyle = "#fff"; starsFore.forEach(s => ctx.fillRect(s[0], s[1], 3, 3));

  if (gameState === "AUTH") {
    ctx.fillStyle = "#00bfff";
    ctx.font = "bold 32px Arial";
    ctx.fillText(`SPACE SHOOTER: ${authMode}`, 40, 60);

    ctx.fillStyle = "#aaa";
    ctx.font = "14px Arial";
    ctx.fillText("[UP/DOWN]: Switch Mode | [TAB]: Switch Field | [ENTER]: Submit", 40, 95);

    ctx.fillStyle = activeField === "username" ? "#00ffff" : "#ccc";
    ctx.font = "18px Arial";
    ctx.fillText(`Username: ${inputUsername}${activeField === "username" ? "|" : ""}`, 40, 150);

    ctx.fillStyle = activeField === "password" ? "#00ffff" : "#ccc";
    ctx.fillText(`Password: ${"*".repeat(inputPassword.length)}${activeField === "password" ? "|" : ""}`, 40, 190);

    if (authMode === "REGISTER") {
      ctx.fillStyle = activeField === "email" ? "#00ffff" : "#ccc";
      ctx.fillText(`Email: ${inputEmail}${activeField === "email" ? "|" : ""}`, 40, 230);
    }

    ctx.fillStyle = authMessage.includes("Error") || authMessage.includes("Warning") ? "#ff4444" : "#44ff44";
    ctx.fillText(authMessage, 40, 280);

    ctx.fillStyle = "#ffd700";
    ctx.fillText("🏆 SUPABASE LEADERBOARD 🏆", 450, 60);
    leaderboard.forEach((entry, idx) => {
      ctx.fillStyle = "#fff";
      ctx.fillText(`${idx + 1}. ${entry[1]} - ${entry[0]} (Lvl ${entry[2]})`, 450, 100 + idx * 30);
    });

  } else if (gameState === "PLAYING") {
    // Ship
    if (picture_ship.complete && picture_ship.naturalWidth !== 0) ctx.drawImage(picture_ship, shipX, shipY, 65, 70);
    else { ctx.fillStyle = "#00bfff"; ctx.fillRect(shipX, shipY, 65, 70); }

    // Missiles
    missiles.forEach(m => {
      if (picture_missile.complete && picture_missile.naturalWidth !== 0) ctx.drawImage(picture_missile, m.x, m.y, 15, 30);
      else { ctx.fillStyle = "#ffff00"; ctx.fillRect(m.x, m.y, 4, 10); }
    });

    // Enemies
    enemies.forEach(e => {
      if (picture_enemy.complete && picture_enemy.naturalWidth !== 0) ctx.drawImage(picture_enemy, e.x, e.y, 30, 30);
      else { ctx.fillStyle = "#ff0000"; ctx.fillRect(e.x, e.y, 30, 30); }
    });

    // HUD
    ctx.fillStyle = "#fff";
    ctx.font = "18px Arial";
    ctx.fillText(`Pilot: ${loggedInUser} | Score: ${score} | HP: ${playerHealth}/${playerMaxHealth}`, 10, 25);

  } else if (gameState === "GAMEOVER") {
    ctx.fillStyle = "#ff0000";
    ctx.font = "bold 48px Arial";
    ctx.fillText("GAME OVER", 50, 100);

    ctx.fillStyle = "#fff";
    ctx.font = "20px Arial";
    ctx.fillText(`Final Score: ${score}`, 50, 160);
    ctx.fillText("Press 'R' to Restart", 50, 220);
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
